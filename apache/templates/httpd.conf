# Generated by EasyServer from templates/httpd.conf. Edits here are overwritten on every start;
# change the plugin's settings in the app instead.
ServerRoot "{{runtimeDir}}"
ServerName {{hostname}}
DefaultRuntimeDir "{{runtimeDir}}"
PidFile "{{runtimeDir}}/httpd.pid"
Listen {{#if settings.listen=local}}127.0.0.1:{{/if}}{{settings.port}}

{{#unless isWin}}
<IfModule !mpm_prefork_module>
  <IfModule !mpm_event_module>
    <IfModule !mpm_worker_module>
      LoadModule mpm_prefork_module "{{req.httpd.modules}}/mod_mpm_prefork.so"
    </IfModule>
  </IfModule>
</IfModule>
<IfModule !unixd_module>
  LoadModule unixd_module "{{req.httpd.modules}}/mod_unixd.so"
</IfModule>
{{/unless}}
<IfModule !authz_core_module>
  LoadModule authz_core_module "{{req.httpd.modules}}/mod_authz_core.so"
</IfModule>
<IfModule !dir_module>
  LoadModule dir_module "{{req.httpd.modules}}/mod_dir.so"
</IfModule>
<IfModule !mime_module>
  LoadModule mime_module "{{req.httpd.modules}}/mod_mime.so"
</IfModule>
<IfModule !log_config_module>
  LoadModule log_config_module "{{req.httpd.modules}}/mod_log_config.so"
</IfModule>
<IfModule !autoindex_module>
  LoadModule autoindex_module "{{req.httpd.modules}}/mod_autoindex.so"
</IfModule>
<IfModule !alias_module>
  LoadModule alias_module "{{req.httpd.modules}}/mod_alias.so"
</IfModule>
<IfModule !headers_module>
  LoadModule headers_module "{{req.httpd.modules}}/mod_headers.so"
</IfModule>

ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 60
KeepAlive On
<IfModule mpm_prefork_module>
  ServerLimit {{settings.maxClients}}
  MaxRequestWorkers {{settings.maxClients}}
</IfModule>
<IfModule mpm_event_module>
  MaxRequestWorkers {{settings.maxClients}}
</IfModule>
<IfModule mpm_winnt_module>
  ThreadsPerChild {{settings.maxClients}}
</IfModule>

ErrorLog "{{logsDir}}/error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "{{logsDir}}/access.log" combined

TypesConfig "{{runtimeDir}}/mime.types"
AddDefaultCharset UTF-8

<Directory />
  AllowOverride None
  Require all denied
</Directory>

DocumentRoot "{{dataDir}}/site"
<Directory "{{dataDir}}/site">
  Options {{#if settings.listing}}+Indexes{{/if}}{{#unless settings.listing}}-Indexes{{/unless}} +FollowSymLinks
  AllowOverride None
  Require all granted
</Directory>
DirectoryIndex {{settings.index}}{{#each settings.extraIndex}} {{this}}{{/each}}

{{#if files.notFoundPage}}
Alias "/__easyserver/404.html" "{{files.notFoundPage}}"
<Directory "{{dataDir}}/settings/notFoundPage">
  Require all granted
</Directory>
ErrorDocument 404 /__easyserver/404.html
{{/if}}

<Files ".*">
  Require all denied
</Files>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header set Cache-Control "public, max-age={{settings.cacheSeconds}}"
